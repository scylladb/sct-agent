name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate trigger ref looks like a release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflow must run on a tag matching v[0-9]+.[0-9]+.[0-9]+; got: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag is reachable from master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from master; refusing to release."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full CI suite
        run: make ci

      - name: Build release binaries
        run: make build-all VERSION="${GITHUB_REF_NAME}"

      - name: Create transition alias asset
        run: cp bin/sct-agent-linux-amd64 bin/sct-agent

      - name: Smoke-test binary --version
        run: |
          out="$(./bin/sct-agent-linux-amd64 --version)"
          echo "$out"
          echo "$out" | grep -F "${GITHUB_REF_NAME}" >/dev/null || {
            echo "Smoke test failed: ${GITHUB_REF_NAME} not found in --version output"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bin/sct-agent-linux-amd64
            bin/sct-agent-linux-arm64
            bin/sct-agent
