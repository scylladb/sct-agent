server:
  host: "0.0.0.0"
  port: 16000

security:
  api_keys:
    - "sct-runner-key-1"
    - "sct-runner-key-2"
    - "test-api-key-12345"
  tls:
    enabled: false
    cert_file: "/etc/sct-agent/certs/server.crt"
    key_file: "/etc/sct-agent/certs/server.key"

executor:
  max_concurrent_jobs: 10
  default_timeout_seconds: 1800

logging:
  level: "info"
  
storage:
  type: "memory"
  cleanup_interval_hours: 24
