version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
  settings:
    revive:
      rules:
        # TODO: re-enable once exported APIs have godoc comments
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - source: 'defer .*\.Close\(\)'
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
